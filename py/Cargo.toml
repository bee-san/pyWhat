[package]
name = "pywhat-py"
description = "The Python bindings of the pywhat crate: the module pywhat._pywhat of the pywhat wheel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Built by maturin into the Python package (pyproject.toml), not published as a crate
publish = false

[lib]
name = "_pywhat"
crate-type = ["cdylib"]

[dependencies]
pywhat = { path = ".." }
# 0.29 is the last PyO3 that supports Python 3.8: one abi3 wheel for CPython 3.8 and newer
pyo3 = { version = "0.29.3", features = ["abi3-py38"] }
