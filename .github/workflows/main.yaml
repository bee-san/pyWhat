# .github/workflows/tests.yml
name: Tests
# Pull requests are tested through the pull_request event; running the same commits again on
# every branch push doubled the work (85 push runs vs 59 PR runs in the 30 days to 2026-10-13,
# 9 matrix jobs each, 3 of them on macOS). Superseded runs of the same PR are cancelled.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.7 is EOL and no longer installable on the current
        # ubuntu-latest / macos-latest (arm64) runner images.
        python-version: ['3.8', '3.9', '3.10']
        os: [ubuntu-latest, windows-latest, macos-latest]
        # ubuntu-latest is Ubuntu 26.04, for which actions/setup-python has no
        # Python 3.8 or 3.9 builds. These jobs run on Ubuntu 24.04 instead,
        # under the same names, which branch protection requires.
        include:
          - os: ubuntu-latest
            python-version: '3.8'
            runner: ubuntu-24.04
          - os: ubuntu-latest
            python-version: '3.9'
            runner: ubuntu-24.04
          # macOS arm64 runners (macos-latest) are short of capacity: since 2026-11-04,
          # most jobs are cancelled because no runner takes them. The macOS jobs run on
          # Intel runners instead, under the same names.
          - os: macos-latest
            runner: macos-15-intel
    runs-on: ${{ matrix.runner || matrix.os }}
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      id: python
      with:
        python-version: ${{ matrix.python-version }}
    # nox runs on a current Python, and its sessions on the matrix Python
    # (--force-python).
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    # The package's extension module (py/) is Rust, which pip builds with
    # maturin when the session installs the package
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    # virtualenv 21, which nox creates the sessions' environments with, no
    # longer creates Python 3.8 ones
    - run: |
        python -m pip install --only-binary :all: nox==2025.5.1 virtualenv==20.39.1
    - run: python -m nox --force-python "${{ steps.python.outputs.python-path }}"
      env:
        OS: ${{ matrix.os }}
        PYTHON: ${{ matrix.python-version }}
