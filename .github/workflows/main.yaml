# .github/workflows/tests.yml
name: Tests
# Pull requests are tested through the pull_request event; running the same commits again on
# every branch push doubled the work (85 push runs vs 59 PR runs in the 30 days to 2026-10-13,
# 9 matrix jobs each, 3 of them on macOS). Superseded runs of the same PR are cancelled.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.7 is EOL and no longer installable on the current
        # ubuntu-latest / macos-latest (arm64) runner images.
        python-version: ['3.8', '3.9', '3.10']
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      id: python
      with:
        python-version: ${{ matrix.python-version }}
    # The CI tooling runs on a current Python so it can be installed from
    # wheels only (cffi, which Poetry needs on macOS, has no Python 3.8 arm64
    # wheels). The nox sessions still use the matrix Python (--force-python).
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    # Pinned: Poetry 2.x removed `install --no-dev` and the bundled `export`
    # command. packaging 26.3+ no longer imports on Python 3.8, and Poetry
    # loads its own copy inside the session's Python 3.8 environment.
    - run: |
        python -m pip install --only-binary :all: nox==2025.5.1 poetry==1.8.5 packaging==26.2
    - run: python -m nox --force-python "${{ steps.python.outputs.python-path }}"
      env:
        OS: ${{ matrix.os }}
        PYTHON: ${{ matrix.python-version }}
