[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "pywhat"
# The version of the Rust workspace (Cargo.toml): 6.0.0-alpha.1 there is 6.0.0a1 here
dynamic = ["version"]
description = "What is that thing?"
authors = [{ name = "Bee", email = "github@skerritt.blog" }]
# file_signatures.json is derived from Wikipedia: CC BY-SA 4.0 (NOTICE, issue #302)
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
dependencies = [
    "click>=8.0.0,<9.0.0",
    "rich>=11.0.0",
]

[project.optional-dependencies]
optimize = ["orjson>=3.6.1,<4.0.0"]

[project.scripts]
pywhat = "pywhat.what:main"
what = "pywhat.what:main"

[project.urls]
Documentation = "https://github.com/bee-san/pyWhat/wiki"

[tool.maturin]
# The extension module pywhat._pywhat (py/), in the Python package pywhat/
manifest-path = "py/Cargo.toml"
python-source = "."
module-name = "pywhat._pywhat"
strip = true
# Cargo.toml names the crate's benches and examples, and cargo can't read it without their
# files (cargo package leaves them out of the crate, but the sdist builds from Cargo.toml)
include = [
    { path = "benches/**/*.rs", format = "sdist" },
    { path = "examples/**/*.rs", format = "sdist" },
]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
ignore_missing_imports = true
# mypy 0.990 stopped making the arguments whose default is None Optional, which the
# code relies on (identifier.py)
implicit_optional = true

[[tool.mypy.overrides]]
# Cmd.default() returns what onecmd() returns, a flag that stops the shell, but typeshed
# says it returns None
module = "pywhat.interactive"
disable_error_code = ["override"]

[tool.pytest.ini_options]
addopts = "--black --isort --flake8 --mypy"
# pytest's defaults, and target/, where cargo builds the Rust crate (and scripts/golden.py
# copies the repository)
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "target"]
