[workspace]
# py/ is the Python extension module, which maturin builds (pyproject.toml); cargo commands
# at the root leave it out
members = [".", "py"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "6.0.0-alpha.1"
edition = "2021"
license = "MIT AND CC-BY-SA-4.0"
repository = "https://github.com/bee-san/pyWhat"
rust-version = "1.88"

[package]
name = "pywhat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["Bee <github@skerritt.blog>"]
description = "Identify anything: emails, IP addresses, API keys, cryptocurrency wallets, CTF flags and more"
homepage = "https://github.com/bee-san/pyWhat"
documentation = "https://docs.rs/pywhat"
readme = "README.md"
keywords = ["identify", "regex", "ctf", "security", "forensics"]
categories = ["command-line-utilities", "text-processing", "wasm"]
# The data stays where the Python package has it: pywhat/Data is the single
# source of truth for both.
include = ["/src", "/pywhat/Data/*.json", "/pywhat/Data/regexes/*.json", "/LICENSE", "/NOTICE", "/README.md"]

[features]
default = ["parallel", "files", "children", "mac-vendors", "cli", "verify"]
# The `what` and `pywhat` commands (src/cli/), with the options and the output of the
# Python package's CLI: tables, colours and progress bars. pywhat::cli::main is what they
# run, and what the Python package's `pywhat` and `what` commands call. They need the file
# signatures and every Children table to print what the Python CLI prints.
cli = [
    "files",
    "mac-vendors",
    "dep:comfy-table",
    "dep:indicatif",
    "dep:anstyle-query",
    "dep:terminal_size",
]
# `what --verify`: asks Google whether the Google API keys found are valid (over HTTPS).
verify = ["cli", "dep:ureq"]
# Search the regexes of a large text, and compile them, on rayon's thread pool. Not on
# wasm32, which has no threads.
parallel = ["dep:rayon"]
# Files and directories (Identifier::identify_inputs), with the file signatures of
# pywhat/Data/file_signatures.json (CC BY-SA 4.0, see NOTICE). Not for wasm32.
files = ["dep:walkdir"]
# The tables that `Children` read from data files, for more detail in descriptions: the
# locations of phone numbers (phone_codes.json) and, with `mac-vendors`, the vendors of MAC
# addresses. Without it, these matches have the regex's own description.
children = []
# The vendors of MAC address prefixes in the descriptions of EUI-48 matches: 1.6 MB of data,
# which a web build may leave out.
mac-vendors = ["children"]
# The WebAssembly API (src/wasm.rs): cargo build --lib --target wasm32-unknown-unknown
# --no-default-features --features wasm
wasm = ["dep:wasm-bindgen"]

[dependencies]
regex = "1.13.1"
regex-syntax = "0.8.11"
fancy-regex = "0.20.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# Bitcoin's Base58Check checksums
sha2 = "0.11.1"
rayon = { version = "1.12.0", optional = true }
walkdir = { version = "2.5.0", optional = true }
wasm-bindgen = { version = "=0.2.130", optional = true }

# The CLI (feature `cli`): the --format pretty table, progress bars, colours on Windows
# consoles, and the terminal sizes that rich and click use. Not on wasm32, which has no
# terminal: there the features build the library only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
comfy-table = { version = "8.0.1", optional = true }
indicatif = { version = "0.18.6", optional = true, default-features = false, features = ["unicode-width"] }
anstyle-query = { version = "1.1.5", optional = true }
terminal_size = { version = "0.4.4", optional = true }
# --verify (feature `verify`), without gzip, as Python's urllib
ureq = { version = "3.5.1", optional = true, default-features = false, features = ["rustls"] }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# Only for benches/whole.rs, which compares the speed with lemmeknow, the crate that Ciphey
# used before.
lemmeknow = { version = "=0.8.0", default-features = false }
# tests/charset_only.rs builds the DFA of every regex
regex-automata = { version = "0.4.18", features = ["dfa-build"] }

[[bin]]
name = "what"
path = "src/bin/what.rs"
required-features = ["cli"]

[[bin]]
name = "pywhat"
path = "src/bin/pywhat.rs"
required-features = ["cli"]

[[example]]
name = "bench_file"
required-features = ["files"]

[[bench]]
name = "whole"
harness = false

[[bench]]
name = "false_positives"
harness = false

[profile.release]
lto = "thin"
codegen-units = 4
